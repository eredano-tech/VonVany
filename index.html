    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const boundsCatalunya = L.latLngBounds(
            L.latLng(39.5, -0.5),  
            L.latLng(43.2, 5.0)
        );

        const map = L.map('map', {
            maxBounds: boundsCatalunya,
            maxBoundsViscosity: 0.8,
            minZoom: 8,
            maxZoom: 18
        }).setView([41.35, 2.50], 9);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let llistaMarcadors = [];
        let llistaMunicipis = [];
        let llistaCerca = [];
        let platjaSeleccionada = null;
        let marcadorUbicacioUsuari = null;

        const correccionsUbicacio = {
            "arenys de mar": [41.5794, 2.5497],
            "sant andreu de llavaneres": [41.5712, 2.4816],
            "platja de la musclera": [41.5706, 2.5372],
            "platja musclera": [41.5706, 2.5372],
            "musclera": [41.5706, 2.5372],
            "platja del balis": [41.5645, 2.5058],
            "platja el balis": [41.5645, 2.5058],
            "balis": [41.5645, 2.5058],
            "platja de les barques": [41.6006, 2.6232],
            "platja les barques": [41.6006, 2.6232]
        };

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;

                    marcadorUbicacioUsuari = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: "#2563eb",
                        color: "#ffffff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.95
                    }).addTo(map);

                    marcadorUbicacioUsuari.bindTooltip("📍 La teva ubicació", {
                        permanent: false,
                        direction: 'top'
                    });
                },
                (err) => {
                    console.log("Geolocalització no disponible:", err.message);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        fetch('https://api.counterapi.dev/v1/von-vany-mapa/visites/up')
            .then(response => response.json())
            .then(data => {
                if (data && data.count !== undefined) {
                    document.getElementById('visites-text').innerText = `Persona nº ${data.count} que visita Von Vany!`;
                } else {
                    document.getElementById('visites-text').style.display = 'none';
                }
            })
            .catch(() => {
                document.getElementById('visites-text').style.display = 'none';
            });

        function toggleFiltres() {
            const panel = document.getElementById('panelFiltres');
            const btn = document.getElementById('btnToggle');
            panel.classList.toggle('plegat');
            btn.innerText = panel.classList.contains('plegat') ? '▼ Filtres' : '▲ Plegar';
        }

        function toggleInfo() {
            const quadre = document.getElementById('infoQuadre');
            const btn = document.getElementById('btnToggleInfo');
            quadre.classList.toggle('plegat');
            btn.innerText = quadre.classList.contains('plegat') ? '▲ Més' : '▼ Menys';
        }

        if (window.innerWidth < 768) toggleFiltres();

        function normalitzarCodi(codi) {
            return codi ? String(codi).replace(/^0+/, "").trim() : "";
        }

        function obtenirCodi(obj) {
            if (!obj) return "";
            for (let k of Object.keys(obj)) {
                if (k.toLowerCase().includes('codi') || k.toLowerCase().includes('id_platja')) {
                    let v = normalitzarCodi(obj[k]);
                    if (v) return v;
                }
            }
            return "";
        }

        function netejarText(txt) {
            if (!txt) return "";
            return String(txt)
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/['’`\-_]/g, " ")
                .trim();
        }

        function netejarNomCanonical(txt) {
            if (!txt) return "";
            return netejarText(txt)
                .replace(/\b(platja|platjes|platges|cala|de|del|la|les|el|els|d|l|barcelona|badalona|tarragona|girona)\b/g, " ")
                .replace(/[^a-z0-9]/g, "")
                .trim();
        }

        function esCert(valor) {
            if (!valor) return false;
            const s = String(valor).toLowerCase().trim();
            if (['n/a', 'n/d', 'no', 'false', '0', 'cap', 'sense dades', 'fals', ''].includes(s)) return false;
            return s === 'cert' || s === 'si' || s === 'sí' || s === 'true' || s === '1';
        }

        function teMeduses(txt) {
            if (!txt) return false;
            const s = String(txt).toLowerCase().trim();
            const valorsSenseMeduses = ['n/a', 'n/d', 'sense dades', 'cap', 'no', 'fals', 'false', 'sense meduses', 'cap observació', 'sense observacions', 'nul·la', 'null', 'undefined', '-', ''];
            return !valorsSenseMeduses.includes(s);
        }

        function isIsoDate(str) {
            return typeof str === 'string' && (/\d{4}-\d{2}-\d{2}/.test(str) || str.includes('T00:00:00'));
        }

        function obtenirTempAigua(e) {
            if (!e || typeof e !== 'object') return 'N/D';
            
            for (let [k, v] of Object.entries(e)) {
                let key = k.toLowerCase();
                if ((key.includes('aigua') || key.includes('mar')) && key.includes('temperatura')) {
                    if (v && !isIsoDate(v)) {
                        let numMatch = String(v).match(/\d+([.,]\d+)?/);
                        if (numMatch) {
                            let num = parseFloat(numMatch[0].replace(',', '.'));
                            if (num >= 10 && num <= 35) return `${num} ºC`;
                        }
                    }
                }
            }

            for (let [k, v] of Object.entries(e)) {
                let key = k.toLowerCase();
                if (key.includes('mar') && v) {
                    let numMatch = String(v).match(/\b(1[5-9]|2[0-9]|3[0-5])([.,]\d+)?\b/);
                    if (numMatch) {
                        let num = parseFloat(numMatch[0].replace(',', '.'));
                        return `${num} ºC`;
                    }
                }
            }

            return 'N/D';
        }

        function obtenirTempAmbient(e) {
            if (!e || typeof e !== 'object') return 'N/D';

            for (let [k, v] of Object.entries(e)) {
                let key = k.toLowerCase();
                if (key.includes('temperatura') && !key.includes('aigua') && !key.includes('mar')) {
                    if (v && !isIsoDate(v)) {
                        let strVal = String(v).trim();
                        let numMatch = strVal.match(/\d+([.,]\d+)?/);
                        if (numMatch) {
                            let num = parseFloat(numMatch[0].replace(',', '.'));
                            if (num >= 15 && num <= 48) return `${num} ºC`;
                        }
                    }
                }
            }
            return 'N/D';
        }

        function obtenirEstatMar(e) {
            if (!e || typeof e !== 'object') return 'N/D';

            let candidat = "";
            for (let [k, v] of Object.entries(e)) {
                let key = k.toLowerCase();
                if ((key === 'estat_mar' || key === 'mar_estat' || key === 'estatmar' || key === 'estat_del_mar') && v) {
                    candidat = String(v).trim();
                    break;
                }
            }

            if (!candidat) {
                for (let [k, v] of Object.entries(e)) {
                    let key = k.toLowerCase();
                    if (key.includes('mar') && !key.includes('temp') && !key.includes('qualitat') && !key.includes('bandera') && !key.includes('medus')) {
                        let vStr = String(v).trim();
                        if (vStr && !vStr.match(/^\d+([.,]\d+)?$/) && !['fals','cert','false','true','null','undefined','n/d'].includes(vStr.toLowerCase())) {
                            candidat = vStr;
                            break;
                        }
                    }
                }
            }

            if (!candidat) return 'N/D';

            const ventsEDireccions = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw', 'no', 'so', 'nord', 'sud', 'est', 'oest', 'llevant', 'ponent', 'gregal', 'garbi', 'garbí', 'mestral', 'xaloc', 'tramuntana', 'migjorn'];
            
            let parts = candidat.split(/[.,;]+/).map(p => p.trim()).filter(Boolean);
            let resultatsValids = [];

            parts.forEach(p => {
                let pLower = p.toLowerCase();
                if (['fals', 'cert', 'false', 'true', 'n/a', 'n/d', 'null', 'undefined', 'no', 'si', 'sí'].includes(pLower)) return;
                if (/^\d+([.,]\d+)?(\s*ºc|\s*m)?$/i.test(p)) return;
                if (ventsEDireccions.includes(pLower)) return;
                resultatsValids.push(p);
            });

            if (resultatsValids.length === 0) {
                let clean = candidat.replace(/\b(fals|cert|false|true|null|undefined)\b/gi, '').replace(/\d+([.,]\d+)?/g, '').trim();
                clean = clean.replace(/^[.,; ]+|[.,; ]+$/g, '');
                return clean || 'N/D';
            }

            let res = resultatsValids.join(', ');
            return res.charAt(0).toUpperCase() + res.slice(1);
        }

        function obtenirQualitatAigua(e) {
            if (!e || typeof e !== 'object') return 'N/D';

            let candidat = "";

            for (let [k, v] of Object.entries(e)) {
                let key = k.toLowerCase();
                if ((key.includes('qualitat') || key.includes('aspecte') || key === 'estat_aigua' || key === 'aigua') && v) {
                    candidat = String(v).trim();
                    break;
                }
            }

            if (!candidat) {
                for (let [k, v] of Object.entries(e)) {
                    let key = k.toLowerCase();
                    if (key.includes('aigua') && !key.includes('temp') && !key.includes('mar') && !key.includes('bandera') && !key.includes('medus')) {
                        let vStr = String(v).trim();
                        if (vStr && !vStr.match(/^\d+([.,]\d+)?$/) && !['fals','cert','false','true','null','undefined','n/d'].includes(vStr.toLowerCase())) {
                            candidat = vStr;
                            break;
                        }
                    }
                }
            }

            if (!candidat) return 'N/D';

            let parts = candidat.split(/[.,;]+/).map(p => p.trim()).filter(Boolean);
            let resultatsValids = parts.filter(p => {
                let pLower = p.toLowerCase();
                return !['fals', 'cert', 'false', 'true', 'n/a', 'n/d', 'null', 'undefined', 'no', 'si', 'sí', '0', '1'].includes(pLower);
            });

            if (resultatsValids.length === 0) return 'N/D';

            let res = resultatsValids.join('. ');
            return res.charAt(0).toUpperCase() + res.slice(1);
        }

        function parseDataFlexible(dataStr) {
            if (!dataStr || dataStr === 'N/A' || dataStr === 'N/D') return null;
            let ts = Date.parse(dataStr);
            if (!isNaN(ts)) return new Date(ts);

            const str = String(dataStr).trim();
            const match = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[T\s](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
            if (match) {
                const dia = parseInt(match[1], 10);
                const mes = parseInt(match[2], 10) - 1;
                const any = parseInt(match[3], 10);
                const hores = match[4] ? parseInt(match[4], 10) : 0;
                const minuts = match[5] ? parseInt(match[5], 10) : 0;
                const d = new Date(any, mes, dia, hores, minuts);
                if (!isNaN(d.getTime())) return d;
            }
            return null;
        }

        function formatarData(dataStr) {
            const d = parseDataFlexible(dataStr);
            if (!d) return null;
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const any = d.getFullYear();
            const hores = String(d.getHours()).padStart(2, '0');
            const minuts = String(d.getMinutes()).padStart(2, '0');
            return `${dia}/${mes}/${any} ${hores}:${minuts}`;
        }

        const urlEstatTempsReal = "https://analisi.transparenciacatalunya.cat/resource/4baz-cjv2.json?$limit=10000&$order=:id DESC";
        const urlEquipaments = "https://analisi.transparenciacatalunya.cat/resource/wcxa-38q9.json?$limit=10000";

        const iconaInvisible = L.divIcon({ className: 'icona-invisible', html: '', iconSize: [0, 0] });

        Promise.all([
            fetch(urlEstatTempsReal).then(r => r.json()).catch(() => []),
            fetch(urlEquipaments).then(r => r.json()).catch(() => [])
        ]).then(([estatsTempsReal, equipaments]) => {

            estatsTempsReal.sort((a, b) => {
                const dA = parseDataFlexible(a.estat_data || a.data_actualitzacio || a.data);
                const dB = parseDataFlexible(b.estat_data || b.data_actualitzacio || b.data);
                return (dB ? dB.getTime() : 0) - (dA ? dA.getTime() : 0);
            });

            let dataTextGlobal = "";
            if (estatsTempsReal && estatsTempsReal.length > 0) {
                const e0 = estatsTempsReal[0];
                const rawDateGlobal = e0.estat_data || e0.data_actualitzacio || e0.data;
                dataTextGlobal = formatarData(rawDateGlobal) || "";
            }
            document.getElementById('data-actualitzacio').innerText = dataTextGlobal || "Sense data";

            const mapaCodi = {};
            const mapaNomCanonical = {};
            const llistaEstats = [];

            estatsTempsReal.forEach(e => {
                const codi = obtenirCodi(e);
                if (codi && !mapaCodi[codi]) mapaCodi[codi] = e;
                
                const nomRaw = e.platja || e.nom_platja || e.nomplatja || e.platja_nom || '';
                const nomCan = netejarNomCanonical(nomRaw);
                if (nomCan && !mapaNomCanonical[nomCan]) mapaNomCanonical[nomCan] = e;

                llistaEstats.push({ record: e, codi: codi, canonical: nomCan, raw: netejarText(nomRaw) });
            });

            const municipisAgrupats = {};

            equipaments.forEach(platja => {
                const textPlatjaNet = netejarText(platja.platja);
                const canonicalNet = netejarNomCanonical(platja.platja);

                let lat = null, lng = null;

                if (correccionsUbicacio[textPlatjaNet]) {
                    lat = correccionsUbicacio[textPlatjaNet][0];
                    lng = correccionsUbicacio[textPlatjaNet][1];
                } else if (correccionsUbicacio[canonicalNet]) {
                    lat = correccionsUbicacio[canonicalNet][0];
                    lng = correccionsUbicacio[canonicalNet][1];
                } else {
                    let c1 = parseFloat(platja.coordenada_x);
                    let c2 = parseFloat(platja.coordenada_y);

                    if (!isNaN(c1) && !isNaN(c2)) {
                        if (c1 >= 40 && c1 <= 43 && c2 >= 0 && c2 <= 4) {
                            lat = c1; lng = c2;
                        } else if (c2 >= 40 && c2 <= 43 && c1 >= 0 && c1 <= 4) {
                            lat = c2; lng = c1;
                        }
                    }
                }

                if (!lat || !lng) return;

                const nomMuni = platja.municipi_municipi || 'Desconegut';
                if (!municipisAgrupats[nomMuni]) {
                    municipisAgrupats[nomMuni] = { latSum: 0, lngSum: 0, count: 0, coords: [] };
                }
                municipisAgrupats[nomMuni].latSum += lat;
                municipisAgrupats[nomMuni].lngSum += lng;
                municipisAgrupats[nomMuni].count++;
                municipisAgrupats[nomMuni].coords.push([lat, lng]);

                /* COINCIDÈNCIA DE PLATGES */
                const codiP = obtenirCodi(platja);
                let e = mapaCodi[codiP];

                if (!e && canonicalNet) {
                    e = mapaNomCanonical[canonicalNet];
                }

                if (!e && canonicalNet && canonicalNet.length >= 4) {
                    let trobat = llistaEstats.find(item => item.canonical && (item.canonical.includes(canonicalNet) || canonicalNet.includes(item.canonical)));
                    if (trobat) e = trobat.record;
                }

                if (!e && textPlatjaNet && textPlatjaNet.length >= 4) {
                    let trobat = llistaEstats.find(item => item.raw && (item.raw.includes(textPlatjaNet) || textPlatjaNet.includes(item.raw)));
                    if (trobat) e = trobat.record;
                }

                if (!e) e = {};

                /* BANDERA */
                let rawB = "";
                for (let k of Object.keys(e)) {
                    if (k.toLowerCase().includes('bandera')) {
                        rawB = String(e[k]).toLowerCase().trim();
                        break;
                    }
                }

                let bCol = 'sense_dades', bIcon = '⚪', bTxt = 'SENSE DADES';
                if (rawB.includes('verda')) { bCol = 'verda'; bIcon = '🟢'; bTxt = 'VERDA'; }
                else if (rawB.includes('groga')) { bCol = 'groga'; bIcon = '🟡'; bTxt = 'GROGA'; }
                else if (rawB.includes('vermella')) { bCol = 'vermella'; bIcon = '🔴'; bTxt = 'VERMELLA'; }

                /* MEDUSES */
                let rawMeduses = "";
                for (let k of Object.keys(e)) {
                    if (k.toLowerCase().includes('medus')) {
                        rawMeduses = String(e[k]).trim();
                        break;
                    }
                }
                const hiHaMeduses = teMeduses(rawMeduses);
                const textMedusesMostrar = hiHaMeduses ? `⚠️ Presència (${rawMeduses})` : '✅ Sense meduses';

                const rawDatePlatja = e.estat_data || e.data_actualitzacio || e.data;
                const dataPlatjaText = formatarData(rawDatePlatja) || dataTextGlobal || "N/D";

                const tempAigua = obtenirTempAigua(e);
                const tempAmbient = obtenirTempAmbient(e);
                const estatMarText = obtenirEstatMar(e);
                const qualitatAiguaText = obtenirQualitatAigua(e);

                const urlGoogleMaps = `https://www.google.com/maps?q=${lat},${lng}`;
                const urlWebcam = `https://www.windy.com/?webcams,${lat},${lng},14`;

                const teBanderaBlava = esCert(platja.banderablava);
                const textBanderaBlava = teBanderaBlava ? ' | 🔵 Bandera Blava' : '';

                const popup = `
                    <div class="popup-header">
                        <span class="popup-title">${platja.platja}</span>
                        <span class="popup-subbadge">${bIcon} ${bTxt}${textBanderaBlava}</span>
                    </div>

                    <b>🌊 Estat de la mar:</b> ${estatMarText}<br>
                    <b>🪼 Meduses:</b> ${textMedusesMostrar}<br>
                    <b>🌡️ Ambient:</b> ${tempAmbient}  |  <b>🌊 Aigua:</b> ${tempAigua}<br>
                    <b>💧 Qualitat aigua:</b> ${qualitatAiguaText}
                    <hr>

                    <b>🚽 Lavabos:</b> ${esCert(platja.vaters)?'Sí':'No'}<br>
                    <b>🛟 Vigilància:</b> ${esCert(platja.socorristes)?'Sí':'No'}<br>
                    <b>🚿 Dutxes:</b> ${esCert(platja.dutxes)?'Sí':'No'}<br>
                    <b>♿ Accés PMR:</b> ${esCert(platja.aparcamentdiscapacitats)?'Sí':'No'}<br>
                    <b>🍹 Bars:</b> ${esCert(platja.bars)?'Sí':'No'}<br>
                    <b>🐶 Mascotes:</b> ${esCert(platja.mascotes)?'Sí':'No'}<br>

                    <div class="popup-actions">
                        <a href="${urlWebcam}" target="_blank" rel="noopener" class="btn-popup btn-webcam">📹 Windy WebCam</a>
                        <a href="${urlGoogleMaps}" target="_blank" rel="noopener" class="btn-popup btn-gmaps">🚗 Com arribar-hi</a>
                    </div>
                    <div class="popup-date">📅 Consultat: ${dataPlatjaText}</div>
                `;

                const popupOptions = {
                    autoPan: true,
                    autoPanPaddingTopLeft: L.point(20, 180),
                    autoPanPaddingBottomRight: L.point(20, 50),
                    offset: L.point(0, -10)
                };

                const m = L.marker([lat, lng], { icon: iconaInvisible }).bindPopup(popup, popupOptions);
                m.bindTooltip(`${bIcon} ${platja.platja}`, { permanent: true, direction: 'center', className: 'etiqueta-platja-nom', interactive: true });

                m.on('click', () => {
                    platjaSeleccionada = m;
                    enviarVistaPlatja(lat, lng);
                });

                m.dades = { 
                    p: platja, 
                    col: bCol, 
                    hiHaMeduses: hiHaMeduses, 
                    blava: teBanderaBlava 
                };
                llistaMarcadors.push(m);

                llistaCerca.push({
                    tipus: 'platja',
                    nom: platja.platja,
                    nomCerca: netejarText(platja.platja),
                    subtext: nomMuni,
                    lat: lat,
                    lng: lng,
                    marker: m
                });
            });

            /* MUNICIPIS */
            Object.keys(municipisAgrupats).forEach(n => {
                const i = municipisAgrupats[n];
                const nomMuniNet = netejarText(n);

                let latAvg, lngAvg;
                if (correccionsUbicacio[nomMuniNet]) {
                    latAvg = correccionsUbicacio[nomMuniNet][0];
                    lngAvg = correccionsUbicacio[nomMuniNet][1];
                } else {
                    latAvg = i.latSum / i.count;
                    lngAvg = i.lngSum / i.count;
                }

                const mMuni = L.marker([latAvg, lngAvg], { icon: iconaInvisible })
                    .bindTooltip(`${n}`, { permanent: true, direction: 'top', className: 'etiqueta-municipi-nom', offset: [0,-15], interactive: false });
                llistaMunicipis.push(mMuni);

                llistaCerca.push({
                    tipus: 'municipi',
                    nom: n,
                    nomCerca: netejarText(n),
                    subtext: `${i.count} platges`,
                    bounds: L.latLngBounds(i.coords),
                    lat: latAvg,
                    lng: lngAvg
                });
            });

            aplicarFiltres();
        });

        function enviarVistaPlatja(lat, lng) {
            const targetZoom = 13;
            map.flyTo([lat + 0.018, lng], targetZoom, {
                duration: 0.8,
                easeLinearity: 0.25
            });
        }

        function aplicarFiltres() {
            const mostrarMunicipis = document.getElementById('f-municipis').checked;
            llistaMunicipis.forEach(m => {
                if (mostrarMunicipis) m.addTo(map); else map.removeLayer(m);
            });

            const f = {
                verda: document.getElementById('f-verda').checked,
                groga: document.getElementById('f-groga').checked,
                vermella: document.getElementById('f-vermella').checked,
                sense: document.getElementById('f-sense-bandera').checked,
                noMed: document.getElementById('f-sense-meduses').checked,
                blava: document.getElementById('f-banderablava').checked,
                vaters: document.getElementById('f-vaters').checked,
                socors: document.getElementById('f-socorristes').checked,
                dutxes: document.getElementById('f-dutxes').checked,
                disc: document.getElementById('f-discapacitats').checked,
                bars: document.getElementById('f-bars').checked,
                masc: document.getElementById('f-mascotes').checked
            };

            llistaMarcadors.forEach(m => {
                const d = m.dades;
                let v = true;
                if (d.col === 'verda' && !f.verda) v = false;
                if (d.col === 'groga' && !f.groga) v = false;
                if (d.col === 'vermella' && !f.vermella) v = false;
                if (d.col === 'sense_dades' && !f.sense) v = false;
                
                if (f.noMed && d.hiHaMeduses) v = false;
                
                if (f.blava && !d.blava) v = false;
                if (f.vaters && !esCert(d.p.vaters)) v = false;
                if (f.socors && !esCert(d.p.socorristes)) v = false;
                if (f.dutxes && !esCert(d.p.dutxes)) v = false;
                if (f.disc && !esCert(d.p.aparcamentdiscapacitats)) v = false;
                if (f.bars && !esCert(d.p.bars)) v = false;
                if (f.masc && !esCert(d.p.mascotes)) v = false;

                if (m === platjaSeleccionada) {
                    v = true;
                }

                if (v) m.addTo(map); else map.removeLayer(m);
            });
        }

        document.querySelectorAll('.panel-contingut input').forEach(i => i.addEventListener('change', aplicarFiltres));

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchSuggestions = document.getElementById('searchSuggestions');

        function cercarElements(query) {
            const textLliure = netejarText(query);
            if (!textLliure || textLliure.length < 2) {
                searchSuggestions.style.display = 'none';
                return [];
            }

            const resultats = llistaCerca.filter(item => item.nomCerca.includes(textLliure)).slice(0, 8);
            mostrarSuggeriments(resultats);
            return resultats;
        }

        function mostrarSuggeriments(resultats) {
            if (resultats.length === 0) {
                searchSuggestions.style.display = 'none';
                return;
            }

            searchSuggestions.innerHTML = '';
            resultats.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                const icona = item.tipus === 'platja' ? '🏖️' : '🏙️';
                div.innerHTML = `
                    <span>${icona} <b>${item.nom}</b> <small style="color:#64748b;">(${item.subtext})</small></span>
                    <span class="suggestion-tag">${item.tipus}</span>
                `;
                div.addEventListener('click', () => seleccionarResultat(item));
                searchSuggestions.appendChild(div);
            });

            searchSuggestions.style.display = 'block';
        }

        function seleccionarResultat(item) {
            searchSuggestions.style.display = 'none';
            searchInput.value = item.nom;

            if (item.tipus === 'platja') {
                platjaSeleccionada = item.marker;

                const col = item.marker.dades.col;
                if (col === 'verda') document.getElementById('f-verda').checked = true;
                else if (col === 'groga') document.getElementById('f-groga').checked = true;
                else if (col === 'vermella') document.getElementById('f-vermella').checked = true;
                else if (col === 'sense_dades') document.getElementById('f-sense-bandera').checked = true;

                aplicarFiltres();

                enviarVistaPlatja(item.lat, item.lng);

                setTimeout(() => {
                    item.marker.openPopup();
                }, 850);
            } else if (item.tipus === 'municipi') {
                if (item.bounds) {
                    map.fitBounds(item.bounds, { padding: [50, 50], maxZoom: 13 });
                } else {
                    map.flyTo([item.lat, item.lng], 13, { duration: 0.8 });
                }
            }
        }

        searchInput.addEventListener('input', (e) => cercarElements(e.target.value));

        searchBtn.addEventListener('click', () => {
            const res = cercarElements(searchInput.value);
            if (res.length > 0) seleccionarResultat(res[0]);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const res = cercarElements(searchInput.value);
                if (res.length > 0) seleccionarResultat(res[0]);
            }
        });

        document.addEventListener('click', (e) => {
            if (!document.querySelector('.search-container').contains(e.target)) {
                searchSuggestions.style.display = 'none';
            }
        });
    </script>
</body>
</html>
