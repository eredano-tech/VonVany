    <style>

        /* CERCADOR */
        .search-container {
            position: relative;

            align-items: center;

        }

        .search-box {
            display: flex;
            width: 100%;
            border-radius: 20px;
            background: #f1f5f9;

            overflow: hidden;

        .search-box:focus-within {

        }

        .search-input {

        .search-btn {

            justify-content: center;

        .search-btn:hover {

        .search-suggestions {

        /* MODO MÒBIL ESPECÍFIC */
        @media (max-width: 600px) {

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([41.3851, 2.1734], 9);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let llistaMarcadors = [];
        let llistaMunicipis = [];
        let llistaCerca = [];
        let platjaSeleccionada = null;
        let marcadorUbicacioUsuari = null;

        /* OBTENIR GEOLOCALITZACIÓ DE L'USUARI (PUNT BLAU) */
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;

                    marcadorUbicacioUsuari = L.circleMarker([lat, lng], {
                        radius: 9,
                        fillColor: "#2563eb",
                        color: "#ffffff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.95
                    }).addTo(map);

                    marcadorUbicacioUsuari.bindTooltip("📍 La teva ubicació", {
                        permanent: false,
                        direction: 'top'
                    });
                },
                (err) => {
                    console.log("Geolocalització no disponible o denegada per l'usuari:", err.message);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        /* LÒGICA COMPTADOR DE VISITES */
        fetch('https://api.counterapi.dev/v1/von-vany-mapa/visites/up')
            .then(response => response.json())
            .then(data => {
                if (data && data.count !== undefined) {
                    document.getElementById('visites-text').innerText = `Vostè és la persona número ${data.count} que visita Von Vany!`;
                } else {
                    document.getElementById('visites-text').style.display = 'none';
                }
            })
            .catch(() => {
                document.getElementById('visites-text').style.display = 'none';
            });

        function toggleFiltres() {
            const panel = document.getElementById('panelFiltres');
            const btn = document.getElementById('btnToggle');
            panel.classList.toggle('plegat');
            btn.innerText = panel.classList.contains('plegat') ? '▼ Filtres' : '▲ Plegar';
        }

        if (window.innerWidth < 768) toggleFiltres();

        function normalitzarCodi(codi) {
            return codi ? String(codi).replace(/^0+/, "").trim() : "";
        }

        function netejarText(txt) {
            if (!txt) return "";
            return String(txt).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function netejarNomPlatja(txt) {
            if (!txt) return "";
            return String(txt).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/\b(platja|platjes|cala|de|del|la|les|el|els|d)\b/g, " ")
                .replace(/[^a-z0-9]/g, "").trim();
        }

        function esCert(valor) {
            if (!valor) return false;
            const s = String(valor).toLowerCase().trim();
            if (['n/a', 'n/d', 'no', 'false', '0', 'cap', 'sense dades', ''].includes(s)) return false;
            return s === 'cert' || s === 'si' || s === 'sí' || s === 'true' || s === '1';
        }

        function teMeduses(txt) {
            if (!txt) return false;
            const s = String(txt).toLowerCase().trim();
            const valorsSenseMeduses = ['n/a', 'n/d', 'sense dades', 'cap', 'no', 'sense meduses', 'cap observació', 'sense observacions', 'nul·la', 'null', 'undefined', '-', ''];
            return !valorsSenseMeduses.includes(s);
        }

        function parseDataFlexible(dataStr) {
            if (!dataStr || dataStr === 'N/A' || dataStr === 'N/D') return null;
            
            let ts = Date.parse(dataStr);
            if (!isNaN(ts)) return new Date(ts);

            const str = String(dataStr).trim();
            const match = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[T\s](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
            if (match) {
                const dia = parseInt(match[1], 10);
                const mes = parseInt(match[2], 10) - 1;
                const any = parseInt(match[3], 10);
                const hores = match[4] ? parseInt(match[4], 10) : 0;
                const minuts = match[5] ? parseInt(match[5], 10) : 0;
                const segons = match[6] ? parseInt(match[6], 10) : 0;
                const d = new Date(any, mes, dia, hores, minuts, segons);
                if (!isNaN(d.getTime())) return d;
            }

            return null;
        }

        function formatarData(dataStr) {
            const d = parseDataFlexible(dataStr);
            if (!d) return null;
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const any = d.getFullYear();
            const hores = String(d.getHours()).padStart(2, '0');
            const minuts = String(d.getMinutes()).padStart(2, '0');
            return `${dia}/${mes}/${any} ${hores}:${minuts}`;
        }

        const urlEstatTempsReal = "https://analisi.transparenciacatalunya.cat/resource/4baz-cjv2.json?$limit=10000&$order=:id DESC";
        const urlEquipaments = "https://analisi.transparenciacatalunya.cat/resource/wcxa-38q9.json?$limit=10000";

        const iconaInvisible = L.divIcon({ className: 'icona-invisible', html: '', iconSize: [0, 0] });

        Promise.all([
            fetch(urlEstatTempsReal).then(r => r.json()).catch(() => []),
            fetch(urlEquipaments).then(r => r.json()).catch(() => [])
        ]).then(([estatsTempsReal, equipaments]) => {

            estatsTempsReal.sort((a, b) => {
                const dA = parseDataFlexible(a.estat_data || a.data_actualitzacio || a.data);
                const dB = parseDataFlexible(b.estat_data || b.data_actualitzacio || b.data);
                const tA = dA ? dA.getTime() : 0;
                const tB = dB ? dB.getTime() : 0;
                return tB - tA;
            });

            let dataTextGlobal = "";
            if (estatsTempsReal && estatsTempsReal.length > 0) {
                const e0 = estatsTempsReal[0];
                const rawDateGlobal = e0.estat_data || e0.data_actualitzacio || e0.data;
                dataTextGlobal = formatarData(rawDateGlobal) || "";
            }
            document.getElementById('data-actualitzacio').innerText = "Última act. general: " + (dataTextGlobal || "N/D");

            const mapaCodi = {};
            const mapaNomNetejat = {};
            
            estatsTempsReal.forEach(e => {
                const codi = normalitzarCodi(e.codi_platja || e.codiplatja);
                if (codi && !mapaCodi[codi]) mapaCodi[codi] = e;
                
                const nom = netejarNomPlatja(e.platja);
                if (nom && !mapaNomNetejat[nom]) mapaNomNetejat[nom] = e;
            });

            const municipisAgrupats = {};

            equipaments.forEach(platja => {
                const lat = parseFloat(platja.coordenada_x), lng = parseFloat(platja.coordenada_y);
                if (isNaN(lat) || isNaN(lng)) return;

                const nomMuni = platja.municipi_municipi || 'Desconegut';
                if (!municipisAgrupats[nomMuni]) {
                    municipisAgrupats[nomMuni] = { latSum: 0, lngSum: 0, count: 0, coords: [] };
                }
                municipisAgrupats[nomMuni].latSum += lat;
                municipisAgrupats[nomMuni].lngSum += lng;
                municipisAgrupats[nomMuni].count++;
                municipisAgrupats[nomMuni].coords.push([lat, lng]);

                const codiP = normalitzarCodi(platja.codiplatja);
                const nomNet = netejarNomPlatja(platja.platja);
                let e = mapaCodi[codiP] || mapaNomNetejat[nomNet] || {};

                const rawB = String(e.bandera_estat || e.estat_bandera || '').toLowerCase().trim();
                let bCol = 'sense_dades', bIcon = '⚪', bTxt = 'SENSE DADES';

                if (rawB === 'verda') { bCol = 'verda'; bIcon = '🟢'; bTxt = 'VERDA'; }
                else if (rawB === 'groga') { bCol = 'groga'; bIcon = '🟡'; bTxt = 'GROGA'; }
                else if (rawB === 'vermella') { bCol = 'vermella'; bIcon = '🔴'; bTxt = 'VERMELLA'; }

                const rawMeduses = e.presencia_meduses || e.estat_meduses || 'N/A';
                const hiHaMeduses = teMeduses(rawMeduses);
                const textMedusesMostrar = hiHaMeduses ? `⚠️ Presència (${rawMeduses})` : '✅ Sense meduses';

                const rawDatePlatja = e.estat_data || e.data_actualitzacio || e.data;
                const dataPlatjaText = formatarData(rawDatePlatja) || dataTextGlobal || "N/D";

                const tempAigua = (e.temperatura_aigua && e.temperatura_aigua !== 'N/A' && e.temperatura_aigua !== 'N/D') 
                    ? `${e.temperatura_aigua} ºC` 
                    : 'N/D';

                // URL oficial de Google Maps per a rutes
                const urlGoogleMaps = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

                const popup = `
                    <div class="popup-title">${platja.platja}</div>
                    <b>Estat:</b> ${bIcon} ${bTxt}<br>
                    <i>${e.bandera_motiubandera || 'Sense incidències'}</i><hr>
                    <b>🌡️ Temp. aigua:</b> ${tempAigua}<br>
                    <b>🪼 Meduses:</b> ${textMedusesMostrar}<hr>
                    <b>🔵 Bandera Blava:</b> ${esCert(platja.banderablava)?'Sí':'No'}<br>
                    <b>🚽 Lavabos:</b> ${esCert(platja.vaters)?'Sí':'No'}<br>
                    <b>🛟 Vigilància:</b> ${esCert(platja.socorristes)?'Sí':'No'}<br>
                    <b>🚿 Dutxes:</b> ${esCert(platja.dutxes)?'Sí':'No'}<br>
                    <b>♿ Accés PMR:</b> ${esCert(platja.aparcamentdiscapacitats)?'Sí':'No'}<br>
                    <b>🍹 Bars:</b> ${esCert(platja.bars)?'Sí':'No'}<br>
                    <b>🐶 Mascotes:</b> ${esCert(platja.mascotes)?'Sí':'No'}<br>
                    <a href="${urlGoogleMaps}" target="_blank" class="btn-gmaps">🚗 Com arribar-hi (Google Maps)</a>
                    <div class="popup-date">📅 Data consulta (estat_data): ${dataPlatjaText}</div>
                `;

                const m = L.marker([lat, lng], { icon: iconaInvisible }).bindPopup(popup);
                m.bindTooltip(`${bIcon} ${platja.platja}`, { permanent: true, direction: 'center', className: 'etiqueta-platja-nom', interactive: true });

                m.dades = { 
                    p: platja, 
                    col: bCol, 
                    hiHaMeduses: hiHaMeduses, 
                    blava: esCert(platja.banderablava) 
                };
                llistaMarcadors.push(m);

                llistaCerca.push({
                    tipus: 'platja',
                    nom: platja.platja,
                    nomCerca: netejarText(platja.platja),
                    subtext: nomMuni,
                    lat: lat,
                    lng: lng,
                    marker: m
                });
            });

            Object.keys(municipisAgrupats).forEach(n => {
                const i = municipisAgrupats[n];
                const latAvg = i.latSum / i.count;
                const lngAvg = i.lngSum / i.count;

                const mMuni = L.marker([latAvg, lngAvg], { icon: iconaInvisible })
                    .bindTooltip(`${n}`, { permanent: true, direction: 'top', className: 'etiqueta-municipi-nom', offset: [0,-15], interactive: false });
                llistaMunicipis.push(mMuni);

                llistaCerca.push({
                    tipus: 'municipi',
                    nom: n,
                    nomCerca: netejarText(n),
                    subtext: `${i.count} platges`,
                    bounds: L.latLngBounds(i.coords),
                    lat: latAvg,
                    lng: lngAvg
                });
            });

            aplicarFiltres();
        });

        function aplicarFiltres() {
            const mostrarMunicipis = document.getElementById('f-municipis').checked;
            llistaMunicipis.forEach(m => {
                if (mostrarMunicipis) m.addTo(map); else map.removeLayer(m);
            });

            const f = {
                verda: document.getElementById('f-verda').checked,
                groga: document.getElementById('f-groga').checked,
                vermella: document.getElementById('f-vermella').checked,
                sense: document.getElementById('f-sense-bandera').checked,
                noMed: document.getElementById('f-sense-meduses').checked,
                blava: document.getElementById('f-banderablava').checked,
                vaters: document.getElementById('f-vaters').checked,
                socors: document.getElementById('f-socorristes').checked,
                dutxes: document.getElementById('f-dutxes').checked,
                disc: document.getElementById('f-discapacitats').checked,
                bars: document.getElementById('f-bars').checked,
                masc: document.getElementById('f-mascotes').checked
            };

            llistaMarcadors.forEach(m => {
                const d = m.dades;
                let v = true;
                if (d.col === 'verda' && !f.verda) v = false;
                if (d.col === 'groga' && !f.groga) v = false;
                if (d.col === 'vermella' && !f.vermella) v = false;
                if (d.col === 'sense_dades' && !f.sense) v = false;
                
                if (f.noMed && d.hiHaMeduses) v = false;
                
                if (f.blava && !d.blava) v = false;
                if (f.vaters && !esCert(d.p.vaters)) v = false;
                if (f.socors && !esCert(d.p.socorristes)) v = false;
                if (f.dutxes && !esCert(d.p.dutxes)) v = false;
                if (f.disc && !esCert(d.p.aparcamentdiscapacitats)) v = false;
                if (f.bars && !esCert(d.p.bars)) v = false;
                if (f.masc && !esCert(d.p.mascotes)) v = false;

                if (m === platjaSeleccionada) {
                    v = true;
                }

                if (v) m.addTo(map); else map.removeLayer(m);
            });
        }

        document.querySelectorAll('.panel-contingut input').forEach(i => i.addEventListener('change', aplicarFiltres));

        /* LÒGICA DEL CERCADOR I AUTOCOMPLETAT */
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchSuggestions = document.getElementById('searchSuggestions');

        function cercarElements(query) {
            const textLliure = netejarText(query);
            if (!textLliure || textLliure.length < 2) {
                searchSuggestions.style.display = 'none';
                return [];
            }

            const resultats = llistaCerca.filter(item => item.nomCerca.includes(textLliure)).slice(0, 8);
            mostrarSuggeriments(resultats);
            return resultats;
        }

        function mostrarSuggeriments(resultats) {
            if (resultats.length === 0) {
                searchSuggestions.style.display = 'none';
                return;
            }

            searchSuggestions.innerHTML = '';
            resultats.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                const icona = item.tipus === 'platja' ? '🏖️' : '🏙️';
                div.innerHTML = `
                    <span>${icona} <b>${item.nom}</b> <small style="color:#64748b;">(${item.subtext})</small></span>
                    <span class="suggestion-tag">${item.tipus}</span>
                `;
                div.addEventListener('click', () => seleccionarResultat(item));
                searchSuggestions.appendChild(div);
            });

            searchSuggestions.style.display = 'block';
        }

        function seleccionarResultat(item) {
            searchSuggestions.style.display = 'none';
            searchInput.value = item.nom;

            if (item.tipus === 'platja') {
                platjaSeleccionada = item.marker;

                const col = item.marker.dades.col;
                if (col === 'verda') document.getElementById('f-verda').checked = true;
                else if (col === 'groga') document.getElementById('f-groga').checked = true;
                else if (col === 'vermella') document.getElementById('f-vermella').checked = true;
                else if (col === 'sense_dades') document.getElementById('f-sense-bandera').checked = true;

                aplicarFiltres();

                map.flyTo([item.lat, item.lng], 16, { duration: 1.2 });
                setTimeout(() => {
                    item.marker.openPopup();
                }, 1300);
            } else if (item.tipus === 'municipi') {
                if (item.bounds) {
                    map.fitBounds(item.bounds, { padding: [50, 50], maxZoom: 14 });
                } else {
                    map.flyTo([item.lat, item.lng], 13, { duration: 1.2 });
                }
            }
        }

        searchInput.addEventListener('input', (e) => cercarElements(e.target.value));

        searchBtn.addEventListener('click', () => {
            const res = cercarElements(searchInput.value);
            if (res.length > 0) seleccionarResultat(res[0]);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const res = cercarElements(searchInput.value);
                if (res.length > 0) seleccionarResultat(res[0]);
            }
        });

        document.addEventListener('click', (e) => {
            if (!document.querySelector('.search-container').contains(e.target)) {
                searchSuggestions.style.display = 'none';
            }
        });
    </script>
</body>
</html>
